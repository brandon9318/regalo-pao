<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRANDON forever 💔</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6c757d;
            --secondary: #495057;
            --accent: #343a40;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.25);
            --border: rgba(255, 255, 255, 0.4);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .star-field { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0; animation: twinkle var(--dur) ease-in-out infinite; animation-delay: var(--del); }
        @keyframes twinkle { 0% { opacity: 0; transform: scale(0); } 50% { opacity: 0.8; transform: scale(1); } 100% { opacity: 0; transform: scale(0); } }

        .container {
            position: relative; z-index: 10; padding: clamp(1.5rem, 5vw, 2.5rem); width: 95%; max-width: 600px;
            background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: 30px; border: 1px solid var(--border); box-shadow: var(--shadow);
            text-align: center; animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: auto;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        h1 { 
            font-family: 'Pacifico', cursive; 
            font-size: clamp(2rem, 8vw, 4rem); 
            color: var(--white); 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2); 
            margin-bottom: 10px; 
            line-height: 1.2;
            word-break: break-word;
        }
        .subtitle { 
            font-size: clamp(1rem, 4vw, 1.4rem); 
            color: var(--white); 
            margin-bottom: 20px; 
            font-weight: 600; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1); 
        }
        
        .counter-container {
            background: rgba(255,255,255,0.3);
            padding: clamp(15px, 4vw, 20px);
            border-radius: 20px;
            margin-bottom: 25px;
        }
        
        .counter-title {
            font-size: clamp(1rem, 3.5vw, 1.2rem);
            color: white;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .counter-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(10px, 3vw, 15px);
            margin-top: 15px;
        }
        
        .counter-item {
            background: rgba(255,255,255,0.5);
            padding: clamp(12px, 3vw, 15px) clamp(8px, 2vw, 10px);
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .counter-value {
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            font-weight: 800;
            color: var(--secondary);
            display: block;
            line-height: 1;
        }
        
        .counter-label {
            font-size: clamp(0.7rem, 2.5vw, 0.9rem);
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .controls { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            align-items: center; 
            margin-bottom: 25px; 
        }
        
        .btn {
            border: none; 
            padding: clamp(12px, 3vw, 14px) clamp(25px, 6vw, 35px); 
            font-size: clamp(1rem, 3.5vw, 1.1rem); 
            font-family: 'Quicksand', sans-serif; 
            font-weight: 700;
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            width: 90%; 
            max-width: 300px; 
            justify-content: center;
            position: relative; 
            overflow: hidden;
            touch-action: manipulation;
        }
        
        .btn::after { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: -100%; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); 
            transition: 0.5s; 
        }
        
        .btn:hover::after { left: 100%; }
        .btn:active { transform: scale(0.95); }
        .btn-music { background: var(--primary); color: white; }
        .btn-music.playing { background: var(--accent); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52, 58, 64, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(52, 58, 64, 0); } }

        .bears { 
            display: flex; 
            justify-content: center; 
            gap: clamp(15px, 5vw, 20px); 
            flex-wrap: wrap;
        }
        
        .bear-icon { 
            font-size: clamp(2.5rem, 10vw, 4.5rem); 
            cursor: pointer; 
            transition: 0.4s; 
            filter: drop-shadow(0 8px 8px rgba(0,0,0,0.15)); 
            user-select: none;
            touch-action: manipulation;
        }
        
        .bear-icon:active { transform: scale(1.3) rotate(15deg); }

        .falling-item { 
            position: fixed; 
            top: -50px; 
            font-size: clamp(1.5rem, 5vw, 2rem); 
            animation: fall linear forwards; 
            cursor: pointer; 
            z-index: 5;
            touch-action: manipulation;
        }
        
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
        
        .burst { 
            position: fixed; 
            pointer-events: none; 
            animation: fly 1s ease-out forwards; 
            font-size: clamp(1.2rem, 4vw, 1.5rem); 
            z-index: 20; 
        }
        
        @keyframes fly { to { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--r)); } }

        #player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            z-index: 9999;
        }

        /* Ajustes específicos para móviles */
        @media (max-width: 768px) {
            body {
                padding: 10px 0;
            }
            
            .container {
                width: 92%;
                padding: 1.5rem 1rem;
            }
            
            .counter-grid {
                gap: 8px;
            }
            
            .bears {
                gap: 12px;
            }
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .counter-value {
                font-size: 1.8rem;
            }
            
            .counter-label {
                font-size: 0.65rem;
            }
        }

        /* Evitar scroll horizontal */
        html {
            overflow-x: hidden;
        }
    </style>
</head>
<body>
    <div class="star-field" id="stars"></div>

    <div class="container">
        <h1>BRANDON forever 💔</h1>
        <div class="subtitle">Desde aquel día...</div>

        <div class="counter-container">
            <div class="counter-title">⏳ Tiempo transcurrido</div>
            <div class="counter-grid">
                <div class="counter-item">
                    <span class="counter-value" id="days">0</span>
                    <span class="counter-label">Días</span>
                </div>
                <div class="counter-item">
                    <span class="counter-value" id="hours">0</span>
                    <span class="counter-label">Horas</span>
                </div>
                <div class="counter-item">
                    <span class="counter-value" id="minutes">0</span>
                    <span class="counter-label">Minutos</span>
                </div>
                <div class="counter-item">
                    <span class="counter-value" id="seconds">0</span>
                    <span class="counter-label">Segundos</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-music" id="musicBtn" onclick="toggleMusic()">
                <span>🎵</span> <span id="btnText">Reproducir canción</span>
            </button>
        </div>

        <div class="bears">
            <span class="bear-icon" onclick="burst(event)" ontouchstart="burst(event)">💔</span>
            <span class="bear-icon" onclick="burst(event)" ontouchstart="burst(event)">🖤</span>
            <span class="bear-icon" onclick="burst(event)" ontouchstart="burst(event)">💔</span>
        </div>
    </div>

    <div id="player"></div>

    <script>
        // ESTRELLAS - Menos en móvil para mejor rendimiento
        const starsObj = document.getElementById('stars');
        const starCount = window.innerWidth < 768 ? 30 : 50;
        
        for(let i=0; i<starCount; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random()*100 + '%';
            s.style.top = Math.random()*100 + '%';
            s.style.width = s.style.height = (Math.random()*3+1) + 'px';
            s.style.setProperty('--dur', (Math.random()*3+2)+'s');
            s.style.setProperty('--del', (Math.random()*5)+'s');
            starsObj.appendChild(s);
        }

        // CONTADOR
        const breakupDate = new Date('2026-01-07T21:00:00');
        
        function updateCounter() {
            const now = new Date();
            const diff = now - breakupDate;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;
        }
        
        updateCounter();
        setInterval(updateCounter, 1000);

        // YOUTUBE
        var player, isPlaying = false;
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '200',
                width: '200',
                videoId: 'yG7MPEQm1-w',
                playerVars: { 
                    'playsinline': 1,
                    'controls': 0, 
                    'loop': 1, 
                    'playlist': 'yG7MPEQm1-w',
                    'origin': window.location.origin
                },
                events: { 
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            console.log("Reproductor listo.");
            event.target.setVolume(100);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED && isPlaying) {
                player.playVideo();
            }
        }

        function onPlayerError(event) {
            console.error("Error de YouTube:", event.data);
            alert("⚠️ Hubo un problema cargando la canción (Error " + event.data + "). Intenta recargar la página.");
        }

        function toggleMusic() {
            const btn = document.getElementById('musicBtn');
            const txt = document.getElementById('btnText');
            
            if(!player) {
                alert("Cargando la música... espera un segundo y vuelve a dar clic.");
                return;
            }

            if(isPlaying) {
                player.pauseVideo();
                btn.classList.remove('playing');
                txt.textContent = "Reproducir canción";
                isPlaying = false;
            } else {
                player.playVideo();
                player.setVolume(100);
                
                btn.classList.add('playing');
                txt.textContent = "Sonando...";
                isPlaying = true;
                
                for(let i=0; i<3; i++) setTimeout(() => 
                    createBurst(window.innerWidth/2, window.innerHeight/2), i*300);
            }
        }

        function burst(e) {
            e.preventDefault();
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            createBurst(x, y);
        }

        function createBurst(x, y) {
            const symbols = ['💔', '🖤', '😢', '💀', '⛓️'];
            const burstCount = window.innerWidth < 768 ? 8 : 12;
            
            for(let i=0; i<burstCount; i++) {
                const p = document.createElement('div');
                p.className = 'burst';
                p.textContent = symbols[Math.floor(Math.random()*symbols.length)];
                p.style.left = x + 'px'; 
                p.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const dist = window.innerWidth < 768 ? Math.random() * 60 + 30 : Math.random() * 100 + 50;
                p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
                p.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
                p.style.setProperty('--r', Math.random()*360 + 'deg');
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }

        // LLUVIA - Más lenta en móvil
        const rainInterval = window.innerWidth < 768 ? 1200 : 500;
        
        setInterval(() => {
            const el = document.createElement('div');
            el.className = 'falling-item';
            el.textContent = Math.random()>0.5 ? '💔' : '🖤';
            el.style.left = Math.random()*90+5 + '%';
            el.style.animationDuration = (Math.random()*5+4) + 's';
            document.body.appendChild(el);
            
            const handleClick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                const x = e.touches ? e.touches[0].clientX : e.clientX;
                const y = e.touches ? e.touches[0].clientY : e.clientY;
                createBurst(x, y);
                el.remove();
            };
            
            el.onclick = handleClick;
            el.ontouchstart = handleClick;
            
            setTimeout(() => { if(el.parentNode) el.remove(); }, 9000);
        }, rainInterval);

        // Prevenir zoom en doble tap en iOS
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
